<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BlaBla Radar — suivi temps réel des bus BlaBlaCar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root {
    /* Palette ODIL / vortex.io */
    --color-navy: #113B54;
    --color-chartreuse: #DBE64C;
    --color-white: #FFFFFF;
    --color-periwinkle: #BBD1FF;
    --color-water-green: #E2F4DF;
    --color-pine: #024442;

    --font: 'Mulish', system-ui, sans-serif;
    --font-display: 'Funne Display', 'Poppins', system-ui, sans-serif;
    --radius: 14px;
    --radius-sm: 8px;
  }

  /* ----- Thème clair (défaut) ----- */
  :root, html[data-theme="light"] {
    --bg: #FFFFFF;
    --bg-grad: linear-gradient(180deg, #FFFFFF 0%, #F3FAF1 100%);
    --surface: #FFFFFF;
    --card: #FFFFFF;
    --tint: #E2F4DF;
    --tint-strong: #BBD1FF;
    --border: #DCE7EF;
    --border-strong: #BBD1FF;
    --ink: #113B54;
    --ink-dim: #44657B;
    --ink-faded: #7E97A8;
    --accent: #DBE64C;
    --accent-ink: #113B54;
    --pine: #024442;
    --ok: #024442;
    --ok-bg: #E2F4DF;
    --late: #A93A26;
    --late-bg: #FBEAE5;
    --early: #2C5F8A;
    --early-bg: #E9F0FF;
    --warn: #7A6A00;
    --shadow: 0 1px 3px rgba(17, 59, 84, 0.08), 0 6px 20px rgba(17, 59, 84, 0.07);
    --shadow-soft: 0 1px 2px rgba(17, 59, 84, 0.06);
    --map-past: #024442;
    --map-future: #6E8CA0;
    --map-offroute: #2C5F8A;
    --map-bg: #f4f7f9;
    --fl-ok: #02704F;
    --fl-warn: #B98900;
    --fl-late: #C03A23;
    --fl-na: #8DA2B0;
  }

  /* ----- Thème sombre ----- */
  html[data-theme="dark"] {
    --bg: #0B2433;
    --bg-grad: linear-gradient(180deg, #0B2433 0%, #0E2E42 100%);
    --surface: #113B54;
    --card: #15425E;
    --tint: #0F3347;
    --tint-strong: #1C4E6D;
    --border: #1E4D68;
    --border-strong: #2A5E7F;
    --ink: #F2F7FB;
    --ink-dim: #BBD1FF;
    --ink-faded: #6E8CA0;
    --accent: #DBE64C;
    --accent-ink: #113B54;
    --pine: #8AD8B0;
    --ok: #8AD8B0;
    --ok-bg: rgba(138, 216, 176, 0.12);
    --late: #FF9C86;
    --late-bg: rgba(255, 156, 134, 0.12);
    --early: #8FB8E8;
    --early-bg: rgba(143, 184, 232, 0.12);
    --warn: #DBE64C;
    --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, 0.25);
    --map-past: #8AD8B0;
    --map-future: #BBD1FF;
    --map-offroute: #DBE64C;
    --map-bg: #0B2433;
    --fl-ok: #7FD8A8;
    --fl-warn: #DBE64C;
    --fl-late: #FF8A72;
    --fl-na: #7E96A8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
  }

  body {
    background: var(--bg-grad) fixed;
    padding: 18px 14px 60px;
    transition: background 0.3s, color 0.3s;
  }

  .wrap {
    max-width: 780px;
    margin: 0 auto;
    position: relative;
  }

  /* ----- BRAND HEADER ----- */
  .brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .brand-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .brand-name span {
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 6px;
    padding: 0 7px;
    margin-left: 5px;
  }
  html[data-theme="dark"] .brand-name span { color: #113B54; }
  .brand-sub {
    font-size: 12px;
    color: var(--ink-dim);
    flex: 1;
  }

  /* ----- TOPBAR ----- */
  .topbar {
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-soft);
    padding: 12px 16px;
    border-radius: var(--radius);
  }

  details summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    user-select: none;
  }
  details summary::-webkit-details-marker { display: none; }

  .summary-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--ink);
    text-transform: uppercase;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip {
    font-weight: 700;
    font-size: 12px;
    color: var(--ink);
    background: var(--tint-strong);
    padding: 3px 10px;
    border-radius: 999px;
  }
  html[data-theme="dark"] .chip { color: #113B54; background: var(--color-periwinkle); }

  .toggle-arrow {
    font-size: 10px;
    color: var(--ink-faded);
    transition: transform 0.3s;
    margin-left: auto;
  }
  details[open] > summary .toggle-arrow { transform: rotate(180deg); }

  .config-body {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .form-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .form-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 600;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    min-width: 0;
    border-radius: var(--radius-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .form-row input::placeholder { color: var(--ink-faded); font-weight: 400; }
  .form-row input:focus {
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(187, 209, 255, 0.4);
  }

  .btn {
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid transparent;
    padding: 9px 16px;
    font-family: var(--font);
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: all 0.15s;
    border-radius: 999px;
    box-shadow: var(--shadow-soft);
  }
  .btn:hover { filter: brightness(1.05); transform: translateY(-1px); box-shadow: var(--shadow); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: wait; transform: none; }
  .btn.alt {
    background: transparent;
    color: var(--ink);
    border-color: var(--border-strong);
    box-shadow: none;
  }
  .btn.alt:hover { background: var(--tint); filter: none; }
  .btn.icon {
    background: transparent;
    border-color: var(--border);
    box-shadow: none;
    font-size: 15px;
    padding: 7px 11px;
    line-height: 1;
  }
  .btn.icon:hover { background: var(--tint); filter: none; }
  .btn.small { padding: 6px 12px; font-size: 11px; }

  .editable-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .editable-chips .chip { display: inline-flex; align-items: center; gap: 4px; padding-right: 5px; }
  .chip-remove {
    background: none;
    border: none;
    color: inherit;
    cursor: pointer;
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
    padding: 0 4px;
    opacity: 0.6;
  }
  .chip-remove:hover { opacity: 1; }

  /* ----- VIEW TABS ----- */
  .view-tabs {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    background: var(--tint);
    border-radius: 999px;
    padding: 4px;
  }
  .tab {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--ink-dim);
    font-family: var(--font);
    font-weight: 700;
    font-size: 13px;
    padding: 9px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: var(--shadow-soft);
  }
  html[data-theme="dark"] .tab.active { background: var(--surface); }

  .status {
    margin-top: 12px;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink-dim);
    letter-spacing: 0.04em;
    text-align: center;
  }
  .status .ok { color: var(--pine); font-weight: 700; }
  .status .warn { color: var(--warn); font-weight: 700; }

  /* ----- JOURNEY ----- */
  .journey {
    margin-top: 18px;
    animation: slideIn 0.4s ease-out;
    background: var(--card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    padding: 22px 20px;
    border-radius: var(--radius);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .journey-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 14px;
    padding-bottom: 16px;
    margin-bottom: 6px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .line-no {
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--ink-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .route {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    line-height: 1.25;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .route .arrow {
    color: var(--pine);
    margin: 0 8px;
    display: inline-block;
  }

  .progress-count {
    font-weight: 700;
    font-size: 10px;
    color: var(--ink-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: right;
  }
  .progress-count strong {
    display: block;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
    letter-spacing: 0;
  }

  /* ----- TRIP PROGRESS BAR ----- */
  .trip-progress {
    margin: 16px 0 8px;
    padding: 14px 16px;
    background: var(--tint);
    border-radius: var(--radius-sm);
  }
  .trip-progress-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
    font-size: 12px;
    color: var(--ink-dim);
    flex-wrap: wrap;
  }
  .trip-progress-label .target {
    color: var(--ink);
    font-weight: 700;
  }
  .trip-progress-label .eta {
    color: var(--pine);
    font-weight: 800;
    font-size: 12px;
  }
  .progress-bar {
    height: 8px;
    background: var(--card);
    border-radius: 999px;
    position: relative;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pine), var(--accent));
    border-radius: 999px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-pct {
    margin-top: 6px;
    font-weight: 700;
    font-size: 11px;
    color: var(--ink-dim);
  }

  /* ----- TIMELINE ----- */
  .timeline-wrap { margin-top: 14px; }

  .past-toggle {
    list-style: none;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0;
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--pine);
  }
  .past-toggle::-webkit-details-marker { display: none; }
  .past-toggle .caret {
    font-size: 10px;
    transition: transform 0.3s;
  }
  details.past[open] > .past-toggle .caret { transform: rotate(90deg); }
  .past-toggle .count {
    color: var(--ink-faded);
    font-weight: 600;
    margin-left: 4px;
  }

  .timeline {
    position: relative;
    padding-left: 30px;
    margin-top: 10px;
  }
  .timeline.upcoming { margin-top: 6px; }

  .timeline::before {
    content: '';
    position: absolute;
    left: 7px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--pine), var(--tint-strong));
  }
  .timeline.past-only::before { background: var(--pine); opacity: 0.5; }

  .section-label {
    font-weight: 800;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 16px 0 10px;
  }

  .stop {
    position: relative;
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
  }
  .stop:last-child { border-bottom: none; }
  .stop::before {
    content: '';
    position: absolute;
    left: -30px;
    top: 16px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--card);
    border: 2px solid var(--ink-faded);
    transition: all 0.3s;
  }
  .stop.past::before {
    background: var(--pine);
    border-color: var(--pine);
  }
  .stop.next::before {
    background: var(--accent);
    border-color: var(--ink);
    animation: nextPulse 1.6s ease-in-out infinite;
  }
  @keyframes nextPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(219, 230, 76, 0.35); }
    50% { box-shadow: 0 0 0 9px rgba(219, 230, 76, 0.12); }
  }
  .stop.future::before { border-color: var(--border-strong); background: var(--card); }

  .stop-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 5px;
    line-height: 1.3;
  }
  .stop.past .stop-name { color: var(--ink-dim); font-weight: 600; }
  .stop.next .stop-name { color: var(--ink); font-weight: 800; }

  .stop-code {
    font-weight: 600;
    font-size: 9px;
    color: var(--ink-faded);
    letter-spacing: 0.1em;
    margin-left: 6px;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    vertical-align: middle;
  }

  .times {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    font-weight: 500;
    font-size: 12px;
    margin-top: 4px;
  }
  .time-row { display: flex; align-items: baseline; gap: 6px; }
  .time-row .label {
    color: var(--ink-faded);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .time-row .aimed { color: var(--ink-faded); text-decoration: line-through; }
  .time-row .actual {
    color: var(--ink);
    font-weight: 800;
  }
  .time-row .delta {
    font-size: 10px;
    padding: 2px 8px;
    font-weight: 800;
    border-radius: 999px;
  }
  .delta { display: inline-block; }
  .delta.ok    { color: var(--ok);    background: var(--ok-bg); }
  .delta.late  { color: var(--late);  background: var(--late-bg); }
  .delta.early { color: var(--early); background: var(--early-bg); }
  .delta.na    { color: var(--ink-faded); background: var(--tint); }

  .status-pill {
    display: inline-block;
    font-weight: 800;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 8px;
    margin-left: 6px;
    vertical-align: middle;
    border-radius: 999px;
  }
  .pill-ontime   { color: var(--ok);   background: var(--ok-bg); }
  .pill-delayed  { color: var(--late); background: var(--late-bg); }
  .pill-departed { color: var(--ink-dim); background: var(--tint); }
  .pill-arrived  { color: var(--early); background: var(--early-bg); }
  .pill-noreport { color: var(--ink-faded); background: var(--tint); }

  /* ----- FLEET VIEW ----- */
  .fleet-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 18px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    padding: 14px 12px;
    text-align: center;
  }
  .stat-card .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
    line-height: 1.1;
  }
  .stat-card .lbl {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin-top: 4px;
  }
  .stat-card.ok .num { color: var(--ok); }
  .stat-card.late .num { color: var(--late); }

  .fleet-list {
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  .fleet-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .fleet-row:last-child { border-bottom: none; }
  .fleet-row.done { opacity: 0.55; }
  .fleet-line {
    flex-shrink: 0;
    font-weight: 800;
    font-size: 12px;
    color: var(--ink);
    background: var(--tint-strong);
    border-radius: var(--radius-sm);
    padding: 6px 9px;
    min-width: 58px;
    text-align: center;
  }
  html[data-theme="dark"] .fleet-line { color: #113B54; background: var(--color-periwinkle); }
  .fleet-route {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.35;
  }
  .fleet-route .sep { color: var(--pine); margin: 0 5px; font-weight: 400; }
  .fleet-meta {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink-faded);
    margin-top: 2px;
  }
  .fleet-delay { flex-shrink: 0; }
  .fleet-follow { flex-shrink: 0; }

  .fleet-filters {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  /* ----- MAP ----- */
  .map-toggle-wrap {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .map-container {
    margin-top: 14px;
    height: 320px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--map-bg);
    position: relative;
    animation: fadeIn 0.3s ease-out;
  }
  .map-container .leaflet-container {
    background: var(--map-bg);
    font-family: var(--font);
    font-weight: 500;
  }
  .map-container .leaflet-control-attribution {
    background: var(--card);
    color: var(--ink-faded);
    font-size: 9px;
  }
  .map-container .leaflet-control-attribution a { color: var(--ink-dim); }
  .map-container .leaflet-bar {
    border: 1px solid var(--border-strong);
    box-shadow: var(--shadow-soft);
  }
  .map-container .leaflet-bar a {
    background: var(--card);
    color: var(--ink);
    border-bottom: 1px solid var(--border);
  }
  .map-container .leaflet-bar a:hover { background: var(--tint); }
  .map-loading {
    position: absolute;
    inset: 0;
    background: var(--bg);
    opacity: 0.85;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 700;
    z-index: 1000;
    pointer-events: none;
  }
  .map-marker {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid;
    box-shadow: var(--shadow-soft);
  }
  .map-marker.past { background: var(--pine); border-color: var(--pine); }
  .map-marker.next { background: var(--accent); border-color: var(--ink); animation: nextPulse 1.6s infinite; }
  .map-marker.future { background: var(--card); border-color: var(--ink-faded); }
  .map-bus {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--ink);
    box-shadow: var(--shadow);
  }
  .map-container .leaflet-popup-content-wrapper,
  .map-container .leaflet-popup-tip {
    background: var(--card);
    color: var(--ink);
  }

  /* ----- FLEET MAP ----- */
  .map-container.fleet { height: 440px; margin-top: 14px; }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const API = 'https://open-data.bus.blablacar.com/api/siri-lite/estimated-timetable';
const PROXIES = [
  u => u,
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)
];

const STORAGE_KEY = 'neon-transit-buses';
const GEO_KEY = 'neon-transit-geo-v3';

const $ = (id) => document.getElementById(id);
const result = $('result');
const statusEl = $('status');
const input = $('busInput');
const addBtn = $('addBtn');
const refreshBtn = $('refreshBtn');
const chipsDisplay = $('chipsDisplay');
const chipsEdit = $('chipsEdit');
const gpsBtn = $('gpsBtn');
const themeBtn = $('themeBtn');
const tabTracked = $('tabTracked');
const tabFleet = $('tabFleet');

/* ----- Thème clair / sombre ----- */
const THEME_KEY = 'blabla-radar-theme';
const TILE_OPTS = { attribution: '© OpenStreetMap, © CartoDB', subdomains: 'abcd', maxZoom: 19 };
const tileUrl = () => document.documentElement.dataset.theme === 'dark'
  ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
  : 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  // bascule les fonds de carte des cartes déjà ouvertes
  for (const ms of journeyMaps.values()) {
    if (ms.map && ms.tiles) {
      ms.map.removeLayer(ms.tiles);
      ms.tiles = L.tileLayer(tileUrl(), TILE_OPTS).addTo(ms.map);
    }
  }
  // carte de la flotte : fond + couleurs des tracés/bus recalculés
  if (fleetMapState?.map) {
    fleetMapState.map.removeLayer(fleetMapState.tiles);
    fleetMapState.tiles = L.tileLayer(tileUrl(), TILE_OPTS).addTo(fleetMapState.map);
    const colors = fleetColors();
    for (const g of fleetMapState.groups) {
      const color = colors[g.key];
      g.lines.forEach(l => l.layer.setStyle({ color }));
      if (g.marker) g.marker.setIcon(fleetBusIcon(color));
    }

}

let buses = loadBuses();
let lastData = null;
let geoCache = loadGeoCache();
let geoQueue = Promise.resolve();
const journeyMaps = new Map(); // journey id -> { map, opened }

/* ----- GPS state ----- */
let userPos = null;
let userWatchId = null;
let gpsEnabled = false;

function loadBuses() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { const a = JSON.parse(s); if (Array.isArray(a) && a.length) return a; }
  } catch (e) {}
  return [];
}
function saveBuses() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(buses)); } catch (e) {}
}
function loadGeoCache() {
  try { return JSON.parse(localStorage.getItem(GEO_KEY) || '{}'); } catch (e) { return {}; }
}
function saveGeoCache() {
  try { localStorage.setItem(GEO_KEY, JSON.stringify(geoCache)); } catch (e) {}
}

const fmtTime = iso => {
  if (!iso) return null;
  return new Date(iso).toLocaleTimeString('fr-FR', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });
};
const diffMin = (a, b) => {
  if (!a || !b) return null;
  return Math.round((new Date(b) - new Date(a)) / 60000);
};
const escapeHtml = s => String(s ?? '')
  .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
  .replaceAll('>', '&gt;').replaceAll('"', '&quot;');

function deltaBadge(aimed, actual) {
  const d = diffMin(aimed, actual);
  if (d === null) return '';
  if (d === 0) return `<span class="delta ok">à l'heure</span>`;
  if (d > 0)  return `<span class="delta late">+${d} min</span>`;
  return `<span class="delta early">${d} min</span>`;
}

function statusPill(s) {
  if (!s) return '';
  const map = {
    'ON_TIME':   ['pill-ontime',   'À l\'heure'],
    'DELAYED':   ['pill-delayed',  'Retard'],
    'DEPARTED':  ['pill-departed', 'Parti'],
    'ARRIVED':   ['pill-arrived',  'Arrivé'],
    'NO_REPORT': ['pill-noreport', 'Sans info'],
    'CANCELLED': ['pill-delayed',  'Annulé']
  };
  const [cls, label] = map[s] || ['pill-noreport', s];
  return `<span class="status-pill ${cls}">${label}</span>`;
}

function renderTimes(call) {
  const aimedArr = call.aimedArrivalTime;
  const actArr   = call.actualArrivalTime || call.expectedArrivalTime;
  const aimedDep = call.aimedDepartureTime;
  const actDep   = call.actualDepartureTime || call.expectedDepartureTime;

  let html = '<div class="times">';
  if (aimedArr || actArr) {
    html += '<div class="time-row"><span class="label">Arr.</span>';
    if (aimedArr && actArr && aimedArr !== actArr) {
      html += `<span class="aimed">${fmtTime(aimedArr)}</span><span class="actual">${fmtTime(actArr)}</span>${deltaBadge(aimedArr, actArr)}`;
    } else {
      html += `<span class="actual">${fmtTime(aimedArr || actArr)}</span>`;
    }
    html += '</div>';
  }
  if (aimedDep || actDep) {
    html += '<div class="time-row"><span class="label">Dép.</span>';
    if (aimedDep && actDep && aimedDep !== actDep) {
      html += `<span class="aimed">${fmtTime(aimedDep)}</span><span class="actual">${fmtTime(actDep)}</span>${deltaBadge(aimedDep, actDep)}`;
    } else {
      html += `<span class="actual">${fmtTime(aimedDep || actDep)}</span>`;
    }
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderStop(call, kind) {
  const name = call.stopPointName?.[0]?.value ?? '—';
  const code = call.stopPointRef?.value ?? '';
  const arrStatus = call.arrivalStatus;
  const depStatus = call.departureStatus;
  const displayedStatus = (kind === 'past') ? (depStatus || arrStatus) : (arrStatus || depStatus);

  return `
    <div class="stop ${kind}">
      <div class="stop-name">
        ${escapeHtml(name)}
        ${code ? `<span class="stop-code">${escapeHtml(code)}</span>` : ''}
        ${statusPill(displayedStatus)}
      </div>
      ${renderTimes(call)}
    </div>`;
}

/* ----- Trip progress calculation ----- */
function calcTripProgress(recorded, estimated) {
  if (!recorded.length || !estimated.length) return null;
  const last = recorded[recorded.length - 1];
  const next = estimated[0];
  const startStr = last.actualDepartureTime || last.aimedDepartureTime || last.actualArrivalTime || last.aimedArrivalTime;
  const endStr   = next.expectedArrivalTime || next.aimedArrivalTime;
  if (!startStr || !endStr) return null;

  const start = new Date(startStr).getTime();
  const end   = new Date(endStr).getTime();
  if (end <= start) return null;
  const now = Date.now();
  const pct = Math.max(0, Math.min(100, ((now - start) / (end - start)) * 100));
  const minutesRemaining = Math.max(0, Math.round((end - now) / 60000));

  return {
    pct,
    minutesRemaining,
    targetName: next.stopPointName?.[0]?.value ?? '?',
    targetEta: fmtTime(endStr),
    fromName: last.stopPointName?.[0]?.value ?? ''
  };
}

function renderProgressBar(p, gps) {
  if (!p) return '';
  const usingGps = !!gps;
  const pct = usingGps ? gps.pct : p.pct;
  const arrivedSoon = p.minutesRemaining <= 1;
  const gpsExtra = usingGps
    ? `<span class="gps-dist">${formatKm(gps.distToEnd)}</span>${gps.distOff > 2000 ? ` <span style="color:var(--warn);font-size:10px">⚠ ${formatKm(gps.distOff)} hors trajet</span>` : ''}`
    : '';
  return `
    <div class="trip-progress${usingGps ? ' gps' : ''}">
      <div class="trip-progress-label">
        <span>En route vers <span class="target">${escapeHtml(p.targetName)}</span>${usingGps ? '<span class="gps-tag">GPS</span>' : ''}</span>
        <span class="eta">${p.targetEta}${arrivedSoon ? '' : ` · dans ${p.minutesRemaining} min`} ${gpsExtra}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${pct.toFixed(1)}%"></div></div>
      <div class="progress-pct">${pct.toFixed(0)}% parcouru${usingGps ? ' (position réelle)' : ''}</div>
    </div>`;
}

function renderJourney(journey, idx) {
  const recorded = (journey.recordedCalls?.recordedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const estimated = (journey.estimatedCalls?.estimatedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const lineName = journey.publishedLineName?.[0]?.value ?? journey.lineRef?.value ?? '?';

  const all = [...recorded, ...estimated];
  const origin = all[0]?.stopPointName?.[0]?.value ?? '?';
  const dest   = all[all.length-1]?.stopPointName?.[0]?.value ?? '?';

  const progress = calcTripProgress(recorded, estimated);
  const journeyId = `journey-${idx}-${lineName}`;

  let html = `
    <section class="journey" data-id="${journeyId}">
      <div class="journey-head">
        <div>
          <div class="line-no">Ligne ${escapeHtml(lineName)}</div>
          <div class="route">${escapeHtml(origin)} <span class="arrow">▶</span> ${escapeHtml(dest)}</div>
        </div>
        <div class="progress-count"><strong>${recorded.length}/${all.length}</strong>arrêts effectués</div>
      </div>

      ${renderProgressBar(progress)}

      <div class="gps-logs" data-logs-for="${journeyId}"></div>

      <div class="timeline-wrap">`;

  if (recorded.length) {
    html += `
      <details class="past">
        <summary class="past-toggle">
          <span class="caret">▶</span>
          Arrêts passés <span class="count">(${recorded.length})</span>
        </summary>
        <div class="timeline past-only">
          ${recorded.map(c => renderStop(c, 'past')).join('')}
        </div>
      </details>`;
  }

  if (estimated.length) {
    html += `
      <div class="section-label">Prochains arrêts</div>
      <div class="timeline upcoming">
        ${estimated.map((c, i) => renderStop(c, i === 0 ? 'next' : 'future')).join('')}
      </div>`;
  }

  if (!recorded.length && !estimated.length) {
    html += `<div class="message">Aucun arrêt disponible.</div>`;
  }

  html += `
      </div>
      <div class="map-toggle-wrap">
        <button class="btn alt map-btn" data-journey="${journeyId}">📍 Afficher la carte</button>
      </div>
    </section>`;
  return { html, journey, journeyId, progress };
}

/* ----- Geometric projection of GPS onto current leg ----- */
function projectOnSegment(P, A, B) {
  // P, A, B are [lat, lon]
  // Equirectangular projection centered on segment midpoint
  const refLat = (A[0] + B[0]) / 2;
  const cosRef = Math.cos(refLat * Math.PI / 180);
  const M = 111320; // meters per degree (roughly)
  const ax = A[1] * cosRef * M, ay = A[0] * M;
  const bx = B[1] * cosRef * M, by = B[0] * M;
  const px = P[1] * cosRef * M, py = P[0] * M;
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  if (!len2) return { t: 0, point: A.slice(), distOff: 0, distToEnd: 0 };
  let tRaw = ((px - ax) * dx + (py - ay) * dy) / len2;
  const t = Math.max(0, Math.min(1, tRaw));
  const projX = ax + t * dx, projY = ay + t * dy;
  const distOff = Math.hypot(px - projX, py - projY); // perpendicular distance to line
  const segLen = Math.sqrt(len2);
  const distToEnd = (1 - t) * segLen;
  const point = [A[0] + t * (B[0] - A[0]), A[1] + t * (B[1] - A[1])];
  return { t, tRaw, point, distOff, distToEnd, segLen };
}

function formatKm(m) {
  if (m == null) return '';
  if (m < 1000) return Math.round(m) + ' m';
  return (m / 1000).toFixed(m < 10000 ? 1 : 0) + ' km';
}

/* ----- Ensure current leg stops are geocoded for projection ----- */
async function ensureLegCoords(journeyData) {
  if (journeyData.legCoords !== undefined) return journeyData.legCoords;
  const j = journeyData.journey;
  const recorded = (j.recordedCalls?.recordedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const estimated = (j.estimatedCalls?.estimatedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  if (!recorded.length || !estimated.length) {
    journeyData.legCoords = null;
    return null;
  }
  const aName = recorded[recorded.length-1].stopPointName?.[0]?.value ?? '';
  const bName = estimated[0].stopPointName?.[0]?.value ?? '';
  const a = await geocode(aName);
  const b = await geocode(bName);
  if (!a || !b) {
    journeyData.legCoords = null;
    return null;
  }
  journeyData.legCoords = { a, b, aName, bName };
  return journeyData.legCoords;
}

/* ----- Fetch with proxy fallback ----- */
async function fetchData() {
  let lastErr;
  for (let i = 0; i < PROXIES.length; i++) {
    const url = PROXIES[i](API);
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) { lastErr = new Error('HTTP ' + res.status); continue; }
      const data = await res.json();
      return { data, proxyUsed: i };
    } catch (err) { lastErr = err; }
  }
  throw lastErr || new Error('Toutes les sources ont échoué');
}

/* ----- Random line picker ----- */
function journeyInProgress(j) {
  // en cours = a déjà pointé au moins un arrêt ET il en reste au moins un
  const rec = j.recordedCalls?.recordedCall ?? [];
  const est = j.estimatedCalls?.estimatedCall ?? [];
  return rec.length > 0 && est.length > 0;
}

function collectLines(data, inProgressOnly) {
  const lines = new Set();
  for (const frame of (data.estimatedJourneyVersionFrame ?? [])) {
    for (const j of (frame.estimatedVehicleJourney ?? [])) {
      const name = j.publishedLineName?.[0]?.value ?? '';
      if (!name || buses.includes(name)) continue;
      if (inProgressOnly && !journeyInProgress(j)) continue;
      lines.add(name);
    }
  }
  return [...lines];
}

async function pickRandomLine(btn) {
  if (btn) btn.disabled = true;
  statusEl.innerHTML = `<span class="loader"></span>Recherche d'un trajet en cours…`;
  try {
    const { data } = await fetchData();
    let lines = collectLines(data, true);
    if (!lines.length) lines = collectLines(data, false); // aucun trajet en cours : ligne à venir
    if (!lines.length) {
      statusEl.innerHTML = 'Aucun trajet dans le flux';
      return;
    }
    const pick = lines[Math.floor(Math.random() * lines.length)];
    addLine(pick);
  } catch (err) {
    statusEl.innerHTML = 'Erreur de connexion';
    result.innerHTML = `<div class="message error">Impossible de récupérer les données : ${escapeHtml(err.message)}</div>`;
  } finally {
    if (btn) btn.disabled = false;
  }
}

/* ----- Geocoding via Nominatim (with cache + rate limit) ----- */
function cityFromStopName(name) {
  if (!name) return '';
  // Take part before " - " separator: "Toulouse - Matabiau Bus Station" -> "Toulouse"
  let s = name.split(' - ')[0].trim();
  // Strip common French bus/train station suffixes (preserves hyphenated names like "Brive-la-Gaillarde")
  const suffixes = /\s+(Sud|Nord|Est|Ouest|Centre|Centre[- ]Ville|Gare\s+SNCF|Gare\s+TGV|Gare\s+Routière|Gare|Bus\s+Station|Station|Routière|SNCF|TGV|Aéroport|Airport)$/i;
  while (suffixes.test(s)) {
    s = s.replace(suffixes, '').trim();
  }
  return s;
}

async function geocode(stopName) {
  const key = cityFromStopName(stopName);
  if (!key) return null;
  if (geoCache[key]) return geoCache[key];
  return geoQueue = geoQueue.then(async () => {
    if (geoCache[key]) return geoCache[key];
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(key)}&format=json&limit=1&countrycodes=fr,es,it,pt,be,nl,lu,de,ch,at,gb,ie,dk,se,no,fi,pl,cz,sk,hu,hr,si,gr&accept-language=fr`, {
        headers: { 'Accept': 'application/json' }
      });
      const data = await r.json();
      if (data && data[0]) {
        const coords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        geoCache[key] = coords;
        saveGeoCache();
        await new Promise(res => setTimeout(res, 1100)); // Nominatim rate limit
        return coords;
      }
    } catch (e) {}
    geoCache[key] = null;
    saveGeoCache();
    return null;
  });
}

/* ----- Map rendering ----- */
async function toggleMap(btn) {
  const journeyId = btn.dataset.journey;
  const section = btn.closest('.journey');
  let mapState = journeyMaps.get(journeyId);

  if (mapState?.opened) {
    // hide
    mapState.container.style.display = 'none';
    mapState.opened = false;
    btn.textContent = '📍 Afficher la carte';
    return;
  }

  if (!mapState) {
    // create container
    const container = document.createElement('div');
    container.className = 'map-container';
    container.innerHTML = '<div class="map-loading">Géolocalisation des arrêts…</div>';
    section.appendChild(container);
    mapState = { container, opened: true, map: null };
    journeyMaps.set(journeyId, mapState);
  } else {
    mapState.container.style.display = 'block';
    mapState.opened = true;
  }
  btn.textContent = '📍 Masquer la carte';

  // find journey data
  const journeyData = lastData?.journeys?.find(j => j.journeyId === journeyId);
  if (!journeyData) return;

  if (mapState.map) {
    // already rendered, just resize
    setTimeout(() => mapState.map.invalidateSize(), 50);
    updateMapUserMarkers(journeyData);
    return;
  }

  // collect stops in order
  const j = journeyData.journey;
  const recorded = (j.recordedCalls?.recordedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const estimated = (j.estimatedCalls?.estimatedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const stops = [
    ...recorded.map(c => ({ call: c, kind: 'past' })),
    ...estimated.map((c, i) => ({ call: c, kind: i === 0 ? 'next' : 'future' }))
  ];

  // geocode all
  const coords = [];
  for (const s of stops) {
    const name = s.call.stopPointName?.[0]?.value ?? '';
    const c = await geocode(name);
    coords.push({ ...s, name, coords: c });
  }

  // init map
  const loader = mapState.container.querySelector('.map-loading');
  if (loader) loader.remove();

  const valid = coords.filter(c => c.coords);
  if (!valid.length) {
    mapState.container.innerHTML = '<div class="map-loading" style="position:static;height:100%">Aucune coordonnée trouvée</div>';
    return;
  }

  const map = L.map(mapState.container, {
    zoomControl: true,
    attributionControl: true
  }).setView(valid[0].coords, 6);

  mapState.tiles = L.tileLayer(tileUrl(), TILE_OPTS).addTo(map);

  // markers
  valid.forEach(s => {
    const icon = L.divIcon({
      className: '',
      html: `<div class="map-marker ${s.kind}"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
    L.marker(s.coords, { icon })
      .bindPopup(`<b>${escapeHtml(s.name)}</b>`)
      .addTo(map);
  });

  // polyline: past in green, future in pink
  const allCoords = valid.map(s => s.coords);
  const lastPastIdx = valid.map((s,i)=>({...s,i})).filter(s=>s.kind==='past').map(s=>s.i).pop();
  const nextIdx = valid.findIndex(s => s.kind === 'next');

  // compute bus interpolated position if progress data available
  const progress = journeyData.progress;
  let busCoord = null;
  if (progress && lastPastIdx !== undefined && nextIdx >= 0 && valid[lastPastIdx] && valid[nextIdx]) {
    const a = valid[lastPastIdx].coords;
    const b = valid[nextIdx].coords;
    const p = progress.pct / 100;
    busCoord = [a[0] + (b[0]-a[0])*p, a[1] + (b[1]-a[1])*p];
  }

  // past polyline
  if (lastPastIdx !== undefined && lastPastIdx >= 0) {
    const pastPath = allCoords.slice(0, lastPastIdx + 1);
    if (busCoord) pastPath.push(busCoord);
    L.polyline(pastPath, { color: cssVar('--map-past'), weight: 3, opacity: 0.9 }).addTo(map);
  }

  // future polyline
  const futureStartIdx = lastPastIdx !== undefined ? lastPastIdx : -1;
  const futurePath = busCoord
    ? [busCoord, ...allCoords.slice(futureStartIdx + 1)]
    : allCoords.slice(futureStartIdx + 1);
  if (futurePath.length >= 2) {
    L.polyline(futurePath, { color: cssVar('--map-future'), weight: 3, opacity: 0.7, dashArray: '6, 6' }).addTo(map);
  }

  // bus marker
  if (busCoord) {
    const busIcon = L.divIcon({
      className: '',
      html: '<div class="map-bus"></div>',
      iconSize: [20, 20],
      iconAnchor: [10, 10]
    });
    L.marker(busCoord, { icon: busIcon, zIndexOffset: 1000 })
      .bindPopup('<b>🚌 Position estimée</b>')
      .addTo(map);
  }

  // fit bounds
  map.fitBounds(L.latLngBounds(allCoords), { padding: [30, 30] });

  mapState.map = map;
  mapState.routeCoords = allCoords;

  // If GPS is active, add user markers
  updateMapUserMarkers(journeyData);
}

/* ----- GPS: start/stop, projection, update UI ----- */
function startGPS() {
  if (!navigator.geolocation) {
    alert('La géolocalisation n\'est pas disponible sur votre navigateur.');
    return;
  }
  if (userWatchId !== null) return;
  gpsBtn.disabled = true;
  gpsBtn.textContent = '📍 …';

  userWatchId = navigator.geolocation.watchPosition(
    pos => {
      userPos = [pos.coords.latitude, pos.coords.longitude];
      gpsEnabled = true;
      gpsBtn.disabled = false;
      gpsBtn.classList.add('active');
      gpsBtn.textContent = '📍 GPS on';
      onUserPositionUpdate();
    },
    err => {
      gpsBtn.disabled = false;
      gpsBtn.classList.remove('active');
      gpsBtn.textContent = '📍 GPS';
      userWatchId = null;
      gpsEnabled = false;
      userPos = null;
      const msg = err.code === 1 ? 'Permission refusée'
                : err.code === 2 ? 'Position indisponible'
                : err.code === 3 ? 'Timeout'
                : 'Erreur GPS';
      alert('GPS : ' + msg + (location.protocol === 'file:' ? '\n\nNote: La géolocalisation peut être bloquée sur les fichiers locaux (file://). Servez ce fichier via un serveur HTTP (ex: python3 -m http.server).' : ''));
    },
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
  );
}

function stopGPS() {
  if (userWatchId !== null) {
    navigator.geolocation.clearWatch(userWatchId);
    userWatchId = null;
  }
  gpsEnabled = false;
  userPos = null;
  gpsBtn.classList.remove('active');
  gpsBtn.textContent = '📍 GPS';
  // re-render progress bars (back to time-based) and clear map user markers
  onUserPositionUpdate();
}

function logGps(journeyData, lines) {
  const section = result.querySelector(`[data-id="${journeyData.journeyId}"]`);
  if (!section) return;
  const logsEl = section.querySelector('.gps-logs');
  if (!logsEl) return;

  if (!gpsEnabled) {
    logsEl.classList.remove('active');
    logsEl.innerHTML = '';
    return;
  }

  const ts = new Date().toLocaleTimeString('fr-FR');
  const head = `<div class="gps-log-head"><span>Trace GPS · étape en cours</span><span class="ts">${ts}</span></div>`;
  const body = lines.map(l =>
    `<div class="gps-log-line"><span class="prompt">›</span><span class="key">${escapeHtml(l.k)}</span><span class="val">${l.v}</span></div>`
  ).join('');

  logsEl.classList.add('active');
  logsEl.innerHTML = head + body;
}

async function onUserPositionUpdate() {
  if (!lastData?.journeys) return;
  for (const journeyData of lastData.journeys) {
    const logs = [];

    if (gpsEnabled && userPos) {
      logs.push({ k: 'Position GPS', v: `<span class="acc-cyan">${userPos[0].toFixed(5)}, ${userPos[1].toFixed(5)}</span>` });

      // pre-log "geocoding" if leg not yet cached
      const legCached = journeyData.legCoords !== undefined;
      if (!legCached) {
        logs.push({ k: 'Géocodage', v: `<span class="acc-yellow">en cours…</span>` });
        logGps(journeyData, logs);
        logs.pop();
      }

      const leg = await ensureLegCoords(journeyData);
      if (leg) {
        logs.push({ k: 'Étape en cours', v: `<span class="acc-pink">${escapeHtml(leg.aName)}</span> → <span class="acc-pink">${escapeHtml(leg.bName)}</span>` });
        logs.push({ k: 'Arrêt A (départ)', v: `<span class="acc-green">${leg.a[0].toFixed(4)}, ${leg.a[1].toFixed(4)}</span>` });
        logs.push({ k: 'Arrêt B (arrivée)', v: `<span class="acc-green">${leg.b[0].toFixed(4)}, ${leg.b[1].toFixed(4)}</span>` });

        const proj = projectOnSegment(userPos, leg.a, leg.b);
        const pct = (proj.t * 100).toFixed(1);
        const offWarn = proj.distOff > 2000 ? ' <span class="acc-warn">⚠ hors trajet</span>' : '';
        logs.push({ k: 'Projection orthogonale', v: `t = <span class="acc-cyan">${proj.t.toFixed(3)}</span> (${pct}% de l'étape)` });
        logs.push({ k: 'Point projeté', v: `<span class="acc-cyan">${proj.point[0].toFixed(4)}, ${proj.point[1].toFixed(4)}</span>` });
        logs.push({ k: 'Distance restante', v: `<span class="acc-yellow">${formatKm(proj.distToEnd)}</span>` });
        logs.push({ k: 'Longueur étape', v: formatKm(proj.segLen) });
        logs.push({ k: 'Écart au trajet', v: `${formatKm(proj.distOff)}${offWarn}` });

        journeyData.gpsProgress = {
          pct: proj.t * 100,
          point: proj.point,
          distOff: proj.distOff,
          distToEnd: proj.distToEnd
        };
      } else {
        logs.push({ k: 'Étape', v: `<span class="acc-warn">Coordonnées indisponibles — utilisation du temps</span>` });
        journeyData.gpsProgress = null;
      }
    } else {
      journeyData.gpsProgress = null;
    }

    logGps(journeyData, logs);
    updateProgressBarDOM(journeyData);
    updateMapUserMarkers(journeyData);
  }
}

function updateProgressBarDOM(journeyData) {
  const section = result.querySelector(`[data-id="${journeyData.journeyId}"]`);
  if (!section || !journeyData.progress) return;
  const oldBar = section.querySelector('.trip-progress');
  if (!oldBar) return;
  const html = renderProgressBar(journeyData.progress, journeyData.gpsProgress);
  oldBar.outerHTML = html;
}

function updateMapUserMarkers(journeyData) {
  const mapState = journeyMaps.get(journeyData.journeyId);
  if (!mapState?.map) return;
  const map = mapState.map;

  // Clear previous user markers/lines
  if (mapState.userMarker) { map.removeLayer(mapState.userMarker); mapState.userMarker = null; }
  if (mapState.projMarker) { map.removeLayer(mapState.projMarker); mapState.projMarker = null; }
  if (mapState.offRouteLine) { map.removeLayer(mapState.offRouteLine); mapState.offRouteLine = null; }

  if (!gpsEnabled || !userPos) return;

  // User position marker (cyan pulsing)
  const userIcon = L.divIcon({
    className: '',
    html: '<div class="map-user"></div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
  mapState.userMarker = L.marker(userPos, { icon: userIcon, zIndexOffset: 2000 })
    .bindPopup('<b>📍 Ma position</b>')
    .addTo(map);

  // Projected position on the current leg
  if (journeyData.gpsProgress?.point) {
    const projIcon = L.divIcon({
      className: '',
      html: '<div class="map-user-proj"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });
    mapState.projMarker = L.marker(journeyData.gpsProgress.point, { icon: projIcon, zIndexOffset: 1500 })
      .bindPopup(`<b>Projection sur trajet</b><br>${formatKm(journeyData.gpsProgress.distToEnd)} restants`)
      .addTo(map);

    // Dashed line from user to projection (showing how off-route they are)
    mapState.offRouteLine = L.polyline([userPos, journeyData.gpsProgress.point], {
      color: cssVar('--map-offroute'),
      weight: 1.5,
      opacity: 0.6,
      dashArray: '3, 5'
    }).addTo(map);
  }

  // On the FIRST time we add a user marker for this map, refit to include user
  if (!mapState.userFitDone && mapState.routeCoords) {
    mapState.userFitDone = true;
    const allBoundsCoords = [...mapState.routeCoords, userPos];
    map.fitBounds(L.latLngBounds(allBoundsCoords), { padding: [30, 30], maxZoom: 11 });
  }

  // Add recenter-on-me control if not already added
  if (!mapState.recenterControl) {
    const Recenter = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function() {
        const el = L.DomUtil.create('div', 'leaflet-control-recenter');
        el.innerHTML = '◎';
        el.title = 'Centrer sur ma position';
        L.DomEvent.on(el, 'click', (e) => {
          L.DomEvent.stop(e);
          if (userPos) map.flyTo(userPos, Math.max(map.getZoom(), 12), { duration: 0.6 });
        });
        L.DomEvent.disableClickPropagation(el);
        return el;
      }
    });
    mapState.recenterControl = new Recenter();
    mapState.recenterControl.addTo(map);
  }
}

/* ----- Vue flotte : tous les bus du flux avec statut de retard ----- */
let viewMode = 'tracked';

function setView(mode) {
  viewMode = mode;
  tabTracked.classList.toggle('active', mode === 'tracked');
  tabFleet.classList.toggle('active', mode === 'fleet');
  if (mode === 'fleet') loadFleet();
  else loadAll();
}

function journeyDelayMin(j) {
  const est = j.estimatedCalls?.estimatedCall ?? [];
  const next = est[0];
  if (next) {
    return diffMin(next.aimedArrivalTime, next.expectedArrivalTime)
        ?? diffMin(next.aimedDepartureTime, next.expectedDepartureTime);
  }
  const rec = j.recordedCalls?.recordedCall ?? [];
  const last = rec[rec.length - 1];
  if (!last) return null;
  return diffMin(last.aimedArrivalTime, last.actualArrivalTime || last.expectedArrivalTime);
}

function summarizeJourney(j) {
  const rec = (j.recordedCalls?.recordedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const est = (j.estimatedCalls?.estimatedCall ?? []).slice().sort((a,b)=>(a.order||0)-(b.order||0));
  const all = [...rec, ...est];
  const state = rec.length && est.length ? 'en-route' : rec.length ? 'done' : 'upcoming';
  return {
    line: j.publishedLineName?.[0]?.value ?? j.lineRef?.value ?? '?',
    origin: all[0]?.stopPointName?.[0]?.value ?? '?',
    dest: all[all.length - 1]?.stopPointName?.[0]?.value ?? '?',
    done: rec.length,
    total: all.length,
    state,
    delay: journeyDelayMin(j),
    recCalls: rec,
    estCalls: est,
    legPct: calcTripProgress(rec, est)?.pct ?? 0
  };
}

function fleetDelayBadge(delay) {
  if (delay === null) return '<span class="delta na">—</span>';
  if (delay > 0) return `<span class="delta late">+${delay} min</span>`;
  if (delay < 0) return `<span class="delta early">${delay} min</span>`;
  return `<span class="delta ok">à l'heure</span>`;
}

/* ----- Carte de la flotte ----- */
// Lisibilité : couleur du tracé = retard (vert / jaune / rouge / gris),
// style du trait = progression (plein = parcouru, pointillé estompé = restant).
// Aucun marqueur de position personnelle sur cette carte.
let lastFleet = null;
let fleetMapState = null;
let fleetDrawToken = 0;

function destroyFleetMap() {
  fleetDrawToken++;
  if (fleetMapState?.map) fleetMapState.map.remove();
  fleetMapState = null;
}

const fleetColors = () => ({
  ok: cssVar('--fl-ok'), warn: cssVar('--fl-warn'),
  late: cssVar('--fl-late'), na: cssVar('--fl-na')
});

function delayKey(delay) {
  if (delay === null) return 'na';
  if (delay > 15) return 'late';
  if (delay > 5) return 'warn';
  return 'ok';
}

const fleetBusIcon = color => L.divIcon({
  className: '',
  html: `<div class="fleet-bus" style="background:${color}"></div>`,
  iconSize: [14, 14],
  iconAnchor: [7, 7]
});

const FLEET_OPACITY = { done: 0.85, remain: 0.3 };

function highlightFleetGroup(sel) {
  if (!fleetMapState) return;
  for (const g of fleetMapState.groups) {
    const f = !sel || g === sel;
    g.lines.forEach(l => l.layer.setStyle({ opacity: f ? FLEET_OPACITY[l.kind] : 0.05 }));
    if (g.marker) g.marker.setOpacity(f ? 1 : 0.25);
  }
}

function drawFleetJourney(s, coords) {
  const colors = fleetColors();
  const key = delayKey(s.delay);
  const color = colors[key];

  // coords aligné sur [recCalls, estCalls] ; on ne garde que les arrêts géocodés
  const valid = [];
  coords.forEach((c, i) => { if (c) valid.push({ c, isPast: i < s.recCalls.length }); });
  if (!valid.length) return;

  let lastPastIdx;
  valid.forEach((v, i) => { if (v.isPast) lastPastIdx = i; });

  // position du bus : interpolée dans l'étape courante, sinon premier arrêt
  let busPos = null;
  if (lastPastIdx !== undefined && lastPastIdx < valid.length - 1) {
    const a = valid[lastPastIdx].c, b = valid[lastPastIdx + 1].c;
    const p = s.legPct / 100;
    busPos = [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p];
  } else {
    busPos = valid[lastPastIdx ?? 0].c;
  }

  const all = valid.map(v => v.c);
  const lines = [];

  if (lastPastIdx !== undefined) {
    const done = all.slice(0, lastPastIdx + 1);
    done.push(busPos);
    if (done.length >= 2) {
      lines.push({ kind: 'done', layer: L.polyline(done, { color, weight: 3, opacity: FLEET_OPACITY.done }) });
    }
  }
  const start = lastPastIdx !== undefined ? lastPastIdx : -1;
  const remain = lastPastIdx !== undefined ? [busPos, ...all.slice(start + 1)] : all.slice(start + 1);
  if (remain.length >= 2) {
    lines.push({ kind: 'remain', layer: L.polyline(remain, { color, weight: 2, opacity: FLEET_OPACITY.remain, dashArray: '4, 6' }) });
  }

  const marker = L.marker(busPos, { icon: fleetBusIcon(color), zIndexOffset: 500 })
    .bindPopup(`<b>Ligne ${escapeHtml(s.line)}</b><br>${escapeHtml(s.origin)} → ${escapeHtml(s.dest)}<br>${s.done}/${s.total} arrêts · ${fleetDelayBadge(s.delay)}`);

  const group = { lines, marker, key };
  lines.forEach(l => l.layer.addTo(fleetMapState.map));
  marker.addTo(fleetMapState.map);
  marker.on('popupopen', () => highlightFleetGroup(group));
  marker.on('popupclose', () => highlightFleetGroup(null));
  fleetMapState.groups.push(group);
}

async function toggleFleetMap(btn) {
  const wrap = $('fleetMapWrap');
  if (fleetMapState) {
    destroyFleetMap();
    wrap.innerHTML = '';
    btn.textContent = '🗺️ Afficher la carte de la flotte';
    return;
  }
  btn.textContent = '🗺️ Masquer la carte';
  wrap.innerHTML = `<div class="map-container fleet"><div class="fleet-map-progress">Préparation…</div></div>`;
  const container = wrap.querySelector('.map-container');
  const progressEl = wrap.querySelector('.fleet-map-progress');

  const map = L.map(container, { zoomControl: true, attributionControl: true }).setView([46.8, 3.6], 6);
  const tiles = L.tileLayer(tileUrl(), TILE_OPTS).addTo(map);

  const Legend = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd() {
      const el = L.DomUtil.create('div', 'fleet-legend');
      el.innerHTML = `
        <span class="sw" style="background:var(--fl-ok)"></span>≤ 5 min &nbsp;
        <span class="sw" style="background:var(--fl-warn)"></span>5–15 min &nbsp;
        <span class="sw" style="background:var(--fl-late)"></span>&gt; 15 min &nbsp;
        <span class="sw" style="background:var(--fl-na)"></span>inconnu<br>
        <span class="ln"></span>parcouru &nbsp; <span class="ln dash"></span>restant`;
      return el;
    }
  });
  new Legend().addTo(map);

  fleetMapState = { map, tiles, groups: [] };
  const token = ++fleetDrawToken;

  // trajets terminés exclus : le bus n'est plus en circulation
  const list = (lastFleet ?? []).filter(s => s.state !== 'done');
  let drawn = 0;
  progressEl.textContent = `Trajets affichés : 0/${list.length}`;
  for (const s of list) {
    const coords = [];
    for (const call of [...s.recCalls, ...s.estCalls]) {
      const c = await geocode(call.stopPointName?.[0]?.value ?? '');
      if (fleetDrawToken !== token) return; // carte fermée ou vue changée
      coords.push(c);
    }
    drawFleetJourney(s, coords);
    drawn++;
    progressEl.textContent = `Trajets affichés : ${drawn}/${list.length}`;
  }
  progressEl.remove();
}

async function loadFleet() {
  refreshBtn.disabled = true;
  destroyFleetMap();
  result.innerHTML = '';
  journeyMaps.clear();
  statusEl.innerHTML = `<span class="loader"></span>Chargement de la flotte…`;
  try {
    const { data, proxyUsed } = await fetchData();
    const sums = [];
    for (const frame of (data.estimatedJourneyVersionFrame ?? [])) {
      for (const j of (frame.estimatedVehicleJourney ?? [])) sums.push(summarizeJourney(j));
    }

    // en route d'abord, puis départs à venir, puis terminés ; au sein
    // de chaque groupe les plus en retard en premier
    const stateRank = { 'en-route': 0, 'upcoming': 1, 'done': 2 };
    sums.sort((a, b) =>
      (stateRank[a.state] - stateRank[b.state]) || ((b.delay ?? -Infinity) - (a.delay ?? -Infinity))
    );

    const enRoute = sums.filter(s => s.state === 'en-route');
    const knownDelays = sums.filter(s => s.delay !== null && s.state !== 'done');
    const onTime = knownDelays.filter(s => s.delay <= 5).length;
    const late = knownDelays.filter(s => s.delay > 5).length;
    const lateDelays = knownDelays.filter(s => s.delay > 0).map(s => s.delay);
    const avgLate = lateDelays.length ? Math.round(lateDelays.reduce((a, b) => a + b, 0) / lateDelays.length) : 0;

    const stateLabels = { 'en-route': 'en route', 'upcoming': 'départ à venir', 'done': 'trajet terminé' };
    lastFleet = sums;

    result.innerHTML = `
      <div class="fleet-filters">
        <button class="btn alt" id="fleetMapBtn">🗺️ Afficher la carte de la flotte</button>
      </div>
      <div id="fleetMapWrap"></div>
      <div class="fleet-summary">
        <div class="stat-card"><div class="num">${sums.length}</div><div class="lbl">Bus au total</div></div>
        <div class="stat-card"><div class="num">${enRoute.length}</div><div class="lbl">En route</div></div>
        <div class="stat-card ok"><div class="num">${onTime}</div><div class="lbl">À l'heure (≤5 min)</div></div>
        <div class="stat-card late"><div class="num">${late}</div><div class="lbl">En retard${avgLate ? ` · ${avgLate} min moy.` : ''}</div></div>
      </div>
      <div class="fleet-list">
        ${sums.map(s => `
          <div class="fleet-row ${s.state}">
            <div class="fleet-line">${escapeHtml(s.line)}</div>
            <div class="fleet-route">
              ${escapeHtml(s.origin)}<span class="sep">→</span>${escapeHtml(s.dest)}
              <div class="fleet-meta">${s.done}/${s.total} arrêts · ${stateLabels[s.state]}</div>
            </div>
            <div class="fleet-delay">${fleetDelayBadge(s.delay)}</div>
            <button class="btn alt small fleet-follow" data-line="${escapeHtml(s.line)}">Suivre</button>
          </div>`).join('')}
      </div>`;

    result.querySelectorAll('.fleet-follow').forEach(btn => {
      btn.addEventListener('click', () => addLine(btn.dataset.line));
    });
    $('fleetMapBtn').addEventListener('click', e => toggleFleetMap(e.currentTarget));

    const ts = data.responseTimestamp ? new Date(data.responseTimestamp).toLocaleTimeString('fr-FR') : '';
    const proxyTag = proxyUsed > 0 ? ` · <span class="warn">via proxy</span>` : '';
    statusEl.innerHTML = `${ts} · <span class="ok">${sums.length} bus</span> · ${enRoute.length} en route${proxyTag}`;
  } catch (err) {
    statusEl.innerHTML = 'Erreur de connexion';
    result.innerHTML = `<div class="message error">Impossible de récupérer les données : ${escapeHtml(err.message)}</div>`;
  } finally {
    refreshBtn.disabled = false;
  }
}

async function loadAll() {
  destroyFleetMap();
  if (!buses.length) {
    statusEl.innerHTML = 'Aucune ligne suivie';
    result.innerHTML = `
      <div class="message">
        <strong>Bienvenue à bord.</strong>
        <br><br>
        Entrez un n° de ligne BlaBlaCar Bus à suivre,
        <br>ou laissez le hasard choisir un trajet en cours.
        <div class="welcome-actions">
          <div class="form-row">
            <input id="welcomeInput" type="text" placeholder="N° de ligne…" autocomplete="off" inputmode="numeric" />
            <button class="btn" id="welcomeAddBtn">Suivre</button>
          </div>
          <button class="btn alt" id="welcomeRandomBtn">🎲 Trajet aléatoire en cours</button>
          <button class="btn alt" id="welcomeFleetBtn">🚌 Voir toute la flotte</button>
        </div>
      </div>`;
    const wInput = $('welcomeInput');
    $('welcomeAddBtn').addEventListener('click', () => addLine(wInput.value));
    wInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addLine(wInput.value); } });
    $('welcomeRandomBtn').addEventListener('click', e => pickRandomLine(e.currentTarget));
    $('welcomeFleetBtn').addEventListener('click', () => setView('fleet'));
    return;
  }

  addBtn.disabled = true;
  refreshBtn.disabled = true;
  result.innerHTML = '';
  journeyMaps.clear();
  statusEl.innerHTML = `<span class="loader"></span>Mise à jour des lignes…`;

  try {
    const { data, proxyUsed } = await fetchData();
    const frames = data.estimatedJourneyVersionFrame ?? [];

    const allHtml = [];
    const journeys = [];
    let foundCount = 0;
    let idx = 0;
    for (const bus of buses) {
      const matches = [];
      for (const frame of frames) {
        for (const journey of (frame.estimatedVehicleJourney ?? [])) {
          if ((journey.publishedLineName?.[0]?.value ?? '') === bus) matches.push(journey);
        }
      }
      if (matches.length) {
        foundCount++;
        for (const j of matches) {
          const rendered = renderJourney(j, idx++);
          allHtml.push(rendered.html);
          journeys.push(rendered);
        }
      } else {
        allHtml.push(`
          <div class="message">
            Aucun bus <span class="code">${escapeHtml(bus)}</span> actif dans le flux.
            <br><br>
            <span style="font-size:11px">Trajet terminé ou pas encore démarré.</span>
          </div>`);
      }
    }

    lastData = { journeys };

    const ts = data.responseTimestamp ? new Date(data.responseTimestamp).toLocaleTimeString('fr-FR') : '';
    const proxyTag = proxyUsed > 0 ? ` · <span class="warn">via proxy</span>` : '';
    statusEl.innerHTML = `${ts} · <span class="ok">${foundCount}/${buses.length} ligne${buses.length>1?'s':''} active${buses.length>1?'s':''}</span>${proxyTag}`;

    result.innerHTML = allHtml.join('');

    // bind map buttons
    result.querySelectorAll('.map-btn').forEach(btn => {
      btn.addEventListener('click', () => toggleMap(btn));
    });

    // If GPS is already active, recompute projections for the new journey data
    if (gpsEnabled && userPos) {
      onUserPositionUpdate();
    }

  } catch (err) {
    statusEl.innerHTML = 'Erreur de connexion';
    result.innerHTML = `
      <div class="message error">
        Impossible de récupérer les données : ${escapeHtml(err.message)}
        <br><br>
        <span style="font-size:11px">Toutes les sources ont échoué.</span>
      </div>`;
  } finally {
    addBtn.disabled = false;
    refreshBtn.disabled = false;
  }
}

function renderChips() {
  chipsDisplay.innerHTML = buses.length
    ? buses.map(b => `<span class="chip">${escapeHtml(b)}</span>`).join('')
    : `<span style="color:var(--ink-faded);font-size:11px;letter-spacing:0.15em">aucune ligne</span>`;

  chipsEdit.innerHTML = buses.map((b, i) => `
    <span class="chip">
      ${escapeHtml(b)}
      <button class="chip-remove" data-i="${i}" title="Retirer">×</button>
    </span>
  `).join('');

  chipsEdit.querySelectorAll('.chip-remove').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const i = parseInt(btn.dataset.i, 10);
      buses.splice(i, 1);
      saveBuses();
      renderChips();
      loadAll();
    });
  });
}

function addLine(val) {
  val = (val || '').trim();
  if (!val || buses.includes(val)) return;
  buses.push(val);
  saveBuses();
  renderChips();
  setView('tracked');
}

function addBus() {
  const val = input.value;
  input.value = '';
  addLine(val);
}

addBtn.addEventListener('click', addBus);
input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addBus(); } });
refreshBtn.addEventListener('click', () => viewMode === 'fleet' ? loadFleet() : loadAll());
$('randomBtn').addEventListener('click', e => pickRandomLine(e.currentTarget));
tabTracked.addEventListener('click', () => setView('tracked'));
tabFleet.addEventListener('click', () => setView('fleet'));
themeBtn.addEventListener('click', () => {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
});
gpsBtn.addEventListener('click', (e) => {
  e.preventDefault();
  e.stopPropagation();
  if (gpsEnabled) stopGPS();
  else startGPS();
});

let savedTheme = null;
try { savedTheme = localStorage.getItem(THEME_KEY); } catch (e) {}
applyTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

renderChips();
loadAll();
</script>
</body>
</html>
